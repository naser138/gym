# Builds the web version and publishes it to GitHub Pages on every push.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy web app

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx jest --ci

      # Project sites live under /<repo-name>/; a "<user>.github.io" repo lives at the root.
      - name: Compute base path
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "EXPO_BASE_URL=" >> "$GITHUB_ENV"; else echo "EXPO_BASE_URL=/$REPO" >> "$GITHUB_ENV"; fi

      - name: Export web build
        run: npx expo export --platform web

      - name: Post-process for GitHub Pages
        run: node scripts/postbuild-web.mjs dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
