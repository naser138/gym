# Builds an UNSIGNED iOS app (.ipa) on GitHub's free macOS machines.
# Install it on your iPhone with Sideloadly + a free Apple ID (see INSTALL-iPhone.md).
# Run it manually: GitHub → Actions → "iOS unsigned IPA" → Run workflow.
name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (Expo prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MyGym.ipa Payload
          ls -lh MyGym.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGym-ipa
          path: MyGym.ipa
          retention-days: 30
